<!DOCTYPE html>
<html lang="en-US">
<head>

  <!-- Keep MathJax (as requested) -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      "HTML-CSS": { scale: 100 },
      tex2jax: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        displayMath: [['$$','$$']],
        processEscapes: true,
        processEnvironments: true,
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        TeX: {
          equationNumbers: { autoNumber: "AMS" },
          extensions: ["AMSmath.js", "AMSsymbols.js"]
        }
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-AMS_HTML" async defer></script>

  <!-- Minimal, self-contained styling (no external assets) -->
  <style>
    :root{
      --bg:#ffffff;
      --fg:#111111;
      --muted:#555555;
      --border:#e6e6e6;
      --hover:#f6f6f6;
      --maxw: 980px;
      --menuw: 220px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-serif, Georgia, "Times New Roman", Times, serif;
      color:var(--fg);
      background:var(--bg);
      line-height:1.55;
    }

    a{ color:var(--fg); text-decoration:underline; }
    a:hover{ text-decoration-thickness:2px; }

    header{
      border-bottom: 1px solid var(--border);
      padding: 18px 0;
      margin-bottom: 18px;
    }

    .page{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 18px 32px;
      display: grid;
      grid-template-columns: var(--menuw) 1fr;
      gap: 24px;
    }

    /* Top nav (same logical items as original) */
    #menu ul{
      list-style:none;
      margin:0;
      padding:0;
      border: 1px solid var(--border);
      background:#fff;
      padding: 10px;
      position: sticky;
      top: 18px;
      align-self: start;
      display: grid;
      gap: 6px;
    }
    #menu a{
      display:block;
      padding: 8px 10px;
      text-decoration:none;
      border: 1px solid transparent;
    }
    #menu a:hover{
      background: var(--hover);
      border-color: var(--border);
    }

    main{ min-width:0; }

    h1.title{
      margin: 0 0 14px;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: .2px;
    }

    .hero{
      display:flex;
      flex-direction: row;
      gap: 18px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    figure.portrait{
      margin:0;
      width: 180px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      background: #fafafa;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    figure.portrait img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .portrait-placeholder{
      color: var(--muted);
      font-size: 13px;
      text-align:center;
      padding: 10px;
    }

    ul.profiles{
      margin: 0;
      padding-left: 18px;
    }
    ul.profiles li{ margin: 6px 0; }

    @media (max-width: 820px){
      .page{ grid-template-columns: 1fr; }
      #menu ul{ position: relative; top: 0; }
      figure.portrait{ width: 160px; }
    }
  </style>
</head>

<body>
  <header>
    <div style="max-width:980px;margin:0 auto;padding:0 18px;">
      <!-- Optional simple header line; remove if you want it blank -->

    </nav>

    <main id="home">
      <article>

        <div class="hero">
          <div style="width:auto;">
            <figure class="portrait">

              <div class="portrait-placeholder">Portrait placeholder<br>./images/portrait.jpg</div>
            </figure>
          </div>

          <div style="width:auto; align-self:stretch; display:flex; align-items:center;">
            <ul class="profiles">
              <li><a href="./cv.pdf">Academic curriculum vitæ</a></li>
              <li><a href="https://orcid.org/YOUR-ORCID">YOUR-ORCID</a></li>

              <li><a href="https://x.com/YOUR_HANDLE">X (Twitter)</a></li>
              <li><a href="https://www.youtube.com/@YOUR_CHANNEL">YouTube</a></li>
            </ul>
          </div>
        </div>

        <p>

    </main>
  </div>
</body>
</html>
